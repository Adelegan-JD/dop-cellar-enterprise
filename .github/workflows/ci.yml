name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build (bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The committed vite.config.ts is Lovable's Cloudflare-tuned config.
      # For CI / Vercel / Docker builds we swap in vite.config.production.ts
      # exactly as documented in DEPLOYMENT.md — but we do it non-destructively
      # so the swap only exists inside the runner.
      - name: Use production Vite config
        run: |
          if [ -f vite.config.production.ts ]; then
            mv vite.config.ts vite.config.lovable.ts
            mv vite.config.production.ts vite.config.ts
          fi
          # src/server.ts is a Cloudflare Worker entry — TanStack Start's own
          # SSR entry handles requests on Node, so remove it for portable builds.
          rm -f src/server.ts wrangler.jsonc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NITRO_PRESET: node-server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          path: |
            .output
            !.output/**/*.map
          if-no-files-found: error
          retention-days: 14
